<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ESITO PAGAMENTO — GUSTAVOEURO</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05060d;--fg:#eef0f8;--surface:#0b0d17;--panel:#12141f;--line:#1d2130;
--au:#ffb020;--tl:#14e0b0;--rs:#ff5c5c;
--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Space Grotesk',system-ui,sans-serif}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:24px;
background-image:radial-gradient(ellipse at 50% 0%,rgba(255,176,32,.09),transparent 62%)}
.card{max-width:520px;width:100%;background:linear-gradient(180deg,var(--surface),var(--panel));
border:1px solid var(--line);border-radius:14px;padding:34px;text-align:center;position:relative}
.card::before,.card::after{content:'';position:absolute;width:13px;height:13px;border:2px solid var(--au);opacity:.75}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
h1{font-size:20px;letter-spacing:.06em;margin-bottom:6px}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--au);text-transform:uppercase;margin-bottom:22px}
p{font-size:13.5px;line-height:1.85;opacity:.8}
.code{font-family:var(--mono);font-size:21px;letter-spacing:.12em;color:var(--au);margin:14px 0}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--au);border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ok{color:var(--tl)}
a.btn{display:inline-block;margin-top:22px;padding:13px 24px;border-radius:10px;border:1px solid var(--au);
color:var(--au);text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.12em}
small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;opacity:.35;margin-top:26px}
</style>
</head>
<body>
<div class="card" id="c"><div class="spin"></div><h1>VERIFICA IN CORSO</h1><div class="sub">Attendi qualche secondo</div></div>
<script>
(function(){
const API='https://api.paygate.to';
const PROXY='';
const base=()=>PROXY||API;
const eur=n=>'€'+Number(n).toFixed(2).replace('.',',');
let t=null;

function done(p,d){
  const o=JSON.parse(localStorage.getItem('ge-orders')||'[]');
  if(!o.some(x=>x.code===p.code)){
    o.push({code:p.code,date:new Date().toISOString(),total:p.amount,currency:p.currency,
            email:p.email,items:p.items,method:'card',value_coin:d.value_coin,txid:d.txid_out});
    localStorage.setItem('ge-orders',JSON.stringify(o));
  }
  localStorage.removeItem('ge-pending');
  document.getElementById('c').innerHTML=`
    <h1 class="ok">PAGAMENTO CONFERMATO</h1>
    <div class="sub">Ordine registrato</div>
    <div class="code">${p.code}</div>
    <p>Ricevuto <b style="color:var(--au)">${eur(p.amount)}</b><br/>accreditato in USDC (Polygon) al venditore.</p>
    <a class="btn" href="./">TORNA AL SITO</a>
    <small>GUSTAVOEURO</small>`;
  if(t) clearInterval(t);
}

async function poll(){
  const raw=localStorage.getItem('ge-pending'); if(!raw) return;
  let p; try{p=JSON.parse(raw);}catch(_){return;}
  if(!p.ipn_token) return;
  if(Date.now()-p.ts>60*60*1000) return;
  document.getElementById('c').innerHTML=`<div class="spin"></div>
    <h1>ATTESA PAGAMENTO</h1><div class="sub">Controllo automatico</div>
    <div class="code">${p.code}</div>
    <p>Se hai appena pagato, la conferma appare da sola entro pochi secondi.</p>
    <a class="btn" href="./">TORNA AL SITO</a><small>GUSTAVOEURO</small>`;
  try{
    const r=await fetch(base()+'/control/payment-status.php?ipn_token='+encodeURIComponent(p.ipn_token));
    const d=await r.json();
    if(d&&String(d.status).toLowerCase()==='paid') done(p,d);
  }catch(_){}
}
poll(); t=setInterval(poll,6000);
})();
</script>
</body>
</html>
